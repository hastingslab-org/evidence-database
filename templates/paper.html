{% extends 'base.html' %}

{% block content %}
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ paper.title }}</title>
</head>

<body>
    <div class="container">
        <h1>{{ paper.title }}</h1>

        <p class="paper-info"><strong>Author:</strong> {{ paper.author }}</p>
        <p class="paper-info"><strong>Year:</strong> {{ paper.year }}</p>
        <p class="paper-info"><strong>Journal:</strong> {{ paper.journal }}</p>

        <h2 style="margin-top: 30px; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 5px;">Abstract</h2>
        <p class="abstract">{{ paper.abstract }}</p>

        <div class="btn-container">
            <a href="/answer" class="btn btn-secondary">Back to My Answer</a>
            <a href="/" class="btn btn">Ask a New Question</a>
        </div>
    </div>
</body>

{% endblock %}
