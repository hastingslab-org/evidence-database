{% extends 'base.html' %}

{% block content %}
<style>
    /* Custom styling for the list as described previously */
    .my-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .my-list li {
        display: inline-block;
        background-color: #e0e0e0;
        color: #333;
        padding: 6px 10px;
        margin: 4px 4px 4px 0;
        border-radius: 4px;
        font-size: 14px;
    }
    .my-list li.hidden-item {
        display: none;
    }
    .description-preview.clamped {
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 5;
        line-clamp: 5;
        -webkit-box-orient: vertical;
    }
</style>

<header>
    <h1 style="text-align: center; margin-top: 20px;">Variantscape</h1>
</header>
<form action="/variantscape" method="post" style="text-align: center; margin-top: 20px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
    <div class="form-group" style="flex: 1; min-width: 250px; max-width: 300px;">
        <label for="gene-search" style="display: block; font-size: 14px; margin-bottom: 5px;">Enter Gene</label>
        <input id="gene-search" name="gene" type="text" placeholder="Search Gene" style="padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
    </div>
    <div class="form-group" style="flex: 1; min-width: 250px; max-width: 300px;">
        <label for="variant-search" style="display: block; font-size: 14px; margin-bottom: 5px;">Enter Variant</label>
        <input id="variant-search" name="variant" type="text" placeholder="Search Variant" style="padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
    </div>
    <div class="form-group" style="flex: 1; min-width: 250px; max-width: 300px;">
        <label for="disease-search" style="display: block; font-size: 14px; margin-bottom: 5px;">Enter Disease</label>
        <input id="disease-search" name="disease" type="text" placeholder="Search Disease" style="padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
    </div>
    <button type="submit" style="margin-top: 20px; padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer;">
        Search
    </button>
</form>
{% endblock %}
