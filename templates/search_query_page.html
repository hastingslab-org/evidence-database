{% extends 'base.html' %}

{% block content %}
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
    }
    .search-container {
        margin: 20px;
    }
    input[type="text"] {
        padding: 10px;
        width: 300px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background-color: #45a049;
    }
</style>

<h2 style="margin-bottom: 40px;">Searchable literature database for genitourinary cancer</h2>

<div class="search-container">
    <form action="/search" method="post">
        <input type="text" name="query" placeholder="Enter your search query here..." required>
        <button type="submit">Submit</button>
    </form>
</div>



{% endblock %}
