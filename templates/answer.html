{% extends 'base.html' %}

{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2, h4 {
            text-align: center;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        p, li {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
        }

        ol {
            padding-left: 20px;
        }

        .answer-section {
            background-color: #f1f1f1;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            font-size: 18px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h4>Your Question</h4>
        <p id="userQuery"></p>

        <h4>Patient's Characteristics</h4>
        <ul id="patientCharacteristics"></ul>

        <h4>Selected Papers</h4>
        <ol id="selectedPapers"></ol>

        <h2>Answer</h2>
        <div id="liveResponse" class="answer-section"></div>

        <div style="text-align: center;">
            <a href="/" class="btn">Ask a New Question</a>
        </div>
    </div>
</body>

<script>
    // Display user query
    const query = {{ query | tojson }};
    document.getElementById("userQuery").textContent = query;

    // Retrieve and display patient's characteristics

    const patientData = JSON.parse({{ patient_data | tojson | safe }});
    console.log(patientData); // Verify order in console

    const characteristicsList = document.getElementById("patientCharacteristics");

    // Ensure the original order is preserved by directly iterating over patientData
    Object.entries(patientData).forEach(([key, value]) => {
        const listItem = document.createElement("li");
        listItem.textContent = `${key}: ${Array.isArray(value) ? value.join(", ") : value}`;
        characteristicsList.appendChild(listItem);
    });

    // Extract the necessary data from the papers object
    const papers = {{ query_results | tojson }};
    const titles = papers.metadatas[0].map(paper => paper.titles);
    const abstracts = papers.documents[0];
    const authors = papers.metadatas[0].map(paper => paper.first_author);
    const years = papers.metadatas[0].map(paper => paper.year);
    const journals = papers.metadatas[0].map(paper => paper.journal);

    const ol = document.getElementById("selectedPapers");

    titles.forEach((title, index) => {
        const li = document.createElement("li");
        const titleSpan = document.createElement("span");
        titleSpan.textContent = `${title} (by ${authors[index]}, ${years[index]}, ${journals[index]})`;

        const link = document.createElement("a");
        link.href = `/paper_${index + 1}`;
        link.textContent = " [View Paper]";
        link.style.color = "#007bff";
        link.style.textDecoration = "none";
        link.style.marginLeft = "10px";

        link.addEventListener("click", (e) => {
            e.preventDefault();

            const paperData = {
                title: titles[index],
                abstract: abstracts[index],
                author: authors[index],
                year: years[index],
                journal: journals[index]
            };

            fetch(`/paper_${index + 1}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(paperData)
            }).then(response => {
                if (response.ok) {
                    window.location.href = `/paper_${index + 1}`;
                } else {
                    console.error("Failed to send paper data.");
                }
            }).catch(error => {
                console.error("Error:", error);
            });
        });

        li.appendChild(titleSpan);
        li.appendChild(link);
        ol.appendChild(li);
    });

    // Stream LLM response
    const responseContainer = document.getElementById("liveResponse");
    const responseID = "{{ response_id }}";
    const llmAnswer = {{ llm_answer | default('') | tojson }};


    if (llmAnswer === '') {
        streamLLMResponse(query);
    } else {
        responseContainer.innerHTML = llmAnswer;
    }

    function streamLLMResponse(query) {
        responseContainer.innerHTML = "";

        const requestBody = JSON.stringify({
            query: query,
            papers: papers,
            patient_data: patientData,
            response_id: responseID,
        });


        fetch('/stream_response', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: requestBody
        }).then(response => {
            if (!response.body) {
                console.error("Response body is null.");
                responseContainer.innerHTML = "<p style='color: red;'>An error occurred while fetching the response.</p>";
                return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            function readStream() {
                reader.read().then(({ done, value }) => {
                    if (done) {
                        console.log("Stream finished.");
                        return;
                    }
                    responseContainer.innerHTML += decoder.decode(value);
                    readStream();
                });
            }
            readStream();
        }).catch(error => {
            console.error("Error:", error);
            responseContainer.innerHTML = "<p style='color: red;'>An error occurred while fetching the response.</p>";
        });
    }
</script>

{% endblock %}
