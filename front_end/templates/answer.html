{% extends 'base.html' %}

{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <h4>Your Question</h4>
    <p id="userQuery"></p>

    <h4>Patient's Characteristics</h4>
    <p id="patientCharacteristics"></p>

    <h4>Selected papers</h4>
    <p id="selectedPapers"></p>

    <h2 style="margin-top: 20px;">Answer:</h>
    <div id="liveResponse"></div>

</body>


<script>
    const query = {{ query | tojson }};
    document.getElementById("userQuery").textContent = query;

    // Retrieve and display the patient's characteristics
    const patientData = JSON.parse(sessionStorage.getItem("patientData"));
    const characteristicsList = document.getElementById("patientCharacteristics");
    for (const [key, value] of Object.entries(patientData)) {
        const listItem = document.createElement("li");
        listItem.textContent = `${key}: ${Array.isArray(value) ? value.join(", ") : value}`;
        characteristicsList.appendChild(listItem);
    }

    //papers
    // Extract titles from the papers object
    const papers = {{ query_results | tojson }};
    const titles = (papers.metadatas[0]).map(paper => paper.titles);
    
    // Create an ordered list element
    const ol = document.createElement("ol");

    // Populate the ordered list with titles
    titles.forEach((title, index) => {
        const li = document.createElement("li");
        li.textContent = title;
        ol.appendChild(li);
    });

    // Append the ordered list to the HTML element with ID 'selectedPapers'
    document.getElementById("selectedPapers").appendChild(ol);


    // Call the function to stream the LLM response
    streamLLMResponse(query);

    function streamLLMResponse(query) {
        // Use JSON to send the query to the server
        const responseContainer = document.getElementById("liveResponse");
        responseContainer.innerHTML = "";  // Clear previous content

        // Send the query via POST to /stream_response
        fetch('/stream_response', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
        query: query,
        papers: papers
    })  // Send both query and papers as a JSON object
}).then(response => {
            if (!response.body) {
                console.error("Response body is null.");
                responseContainer.innerHTML = "<p style='color: red;'>An error occurred while fetching the response.</p>";
                return;
            }
        
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            // Function to read and append streamed data
            function readStream() {
                reader.read().then(({ done, value }) => {
                    if (done) {
                        console.log("Stream finished.");
                        return;
                    }
                    responseContainer.innerHTML += decoder.decode(value);
                    readStream();  // Continue reading
                });
            }
            readStream();
        }).catch(error => {
            console.error("Error:", error);
            responseContainer.innerHTML = "<p style='color: red;'>An error occurred while fetching the response.</p>";
        });
    }

    </script>

{% endblock %}
