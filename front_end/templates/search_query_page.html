    {% extends 'base.html' %}

    {% block content %}
    <h2 style="margin-bottom: 40px;">Searchable literature database for genitourinary cancer</h2>

        <!-- Patient's Characteristics Form -->
    <div class="form-container">
        <h3>Patient's Characteristics</h3>
        <form id="patientForm">
            <div class="form-group">
                <label>Genitourinary Cancer Type:</label>
                <div class="form-inline-group">
                    <label><input type="checkbox" name="cancerType" value="Bladder Cancer"> Bladder Cancer</label>
                    <label><input type="checkbox" name="cancerType" value="Kidney Cancer"> Kidney Cancer</label>
                    <label><input type="checkbox" name="cancerType" value="Penile Cancer"> Penile Cancer</label>
                    <label><input type="checkbox" name="cancerType" value="Prostate Cancer"> Prostate Cancer</label>
                </div>
                <div class="form-inline-group">
                    <label><input type="checkbox" name="cancerType" value="Renal Cell Cancer"> Renal Cell Cancer</label>
                    <label><input type="checkbox" name="cancerType" value="Renal Pelvis Cancer"> Renal Pelvis Cancer</label>
                    <label><input type="checkbox" name="cancerType" value="Testicular Cancer"> Testicular Cancer</label>
                    <label><input type="checkbox" name="cancerType" value="Urethral Cancer"> Urethral Cancer</label>
                </div>
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <select name="gender">
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                    <option value="Unknown">Unknown</option>
                </select>
            </div>

            <div class="form-group">
                <label>Age (Years):</label>
                <input type="number" name="age" min="0" max="120" placeholder="Enter age">
            </div>

            <div class="form-group">
                <label>ECOG Performance Status (0-5):</label>
                <select name="ecog">
                    <option value="0">0 - Fully active</option>
                    <option value="1">1 - Restricted physically</option>
                    <option value="2">2 - Ambulatory, unable to work</option>
                    <option value="3">3 - Limited self-care</option>
                    <option value="4">4 - Completely disabled</option>
                    <option value="5">5 - Deceased</option>
                </select>
            </div>

            <div class="form-group">
                <label>Race/Ethnicity:</label>
                <select name="race">
                    <option value="Caucasian">Caucasian</option>
                    <option value="African American">African American</option>
                    <option value="Asian">Asian</option>
                    <option value="Hispanic">Hispanic</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </form>
    </div>

    <div class="search-container">
        <form onsubmit="event.preventDefault(); handleFormSubmit();" style="display: flex; width: 100%;">
            <textarea id="queryInput" placeholder="Enter your query here..." required></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        // Function to handle form submission
        async function handleFormSubmit() {
        const query = document.getElementById("queryInput").value;

        // Store the query in sessionStorage
        sessionStorage.setItem("query", query);

        // Redirect to the /answer page
        window.location.href = "/answer";
        }
    </script>
    


    {% endblock %}
