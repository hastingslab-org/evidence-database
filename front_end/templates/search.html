{% extends 'base.html' %}

{% block content %}
<body>
    <h1>Search Results</h1>
    <div class="search-result">
        <p>Your Search: <span id="search-query"></span></p>
    </div>

{% for query in queries %}
    <h4>{{query['content'] }}</h4>
    <span class="badge badge-secondary">{{ query['created'] }}</span>
    <hr>
{% endfor %}
<body>

<div class="LLM-answer">
    <p>LLM answer: <span id="answer"></span></p>
</div>
<h5>This is an answer given by the LLM</h5>

{% endblock %}
