<!doctype html>
<html lang="en">


<style>
  body {
      font-family: Arial, sans-serif;
      text-align: center;
  }
  .search-container {
      display: flex;
      justify-content: center; /* Center the form horizontally */
      margin: 20px auto;
      max-width: 80%; /* Width of the whole container */
  }
  .form-container{
  margin: 20px; /* Add some space from the edges */
  padding: 20px;
  border: 1px solid #ccc;
  border-radius: 8px;
  max-width: 80%; /* Restrict the width */
  text-align: left; 
  background-color: #f9f9f9;
  }
  input[type="text"] {
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 4px;
  }
  textarea {
      padding: 15px; /* Padding inside the box */
      width: 100%; /* Full width */
      max-width: 800px; /* Maximum width */
      height: 150px; /* Height for multiple lines */
      border: 1px solid #ccc;
      border-radius: 4px 0 0 4px; /* Rounded corners on the left */
      font-size: 1.2rem; /* Larger text for better readability */
      resize: none; /* Optional: disable resizing */
  }
  button {
      padding: 10px 20px; /* Padding for button */
      background-color: #4CAF50;
      color: white;
      border: 1px solid #4CAF50;
      border-left: none; /* Remove border between textarea and button */
      border-radius: 0 4px 4px 0; /* Rounded corners on the right */
      font-size: 1rem; /* Button text size */
      cursor: pointer;
      height: auto; /* Let the button size itself */
      align-self: stretch; /* Prevent height inheritance */
  }
  button:hover {
      background-color: #45a049;
  }
</style>

<title>LLM Response</title>
<style>
  #liveResponse {
      white-space: pre-wrap;
      border: 1px solid #ccc;
      padding: 10px;
      font-family: monospace;
      min-height: 50px;
  }
</style>

  <head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    
    <title>{% block title %} {% endblock %}</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-light bg-light">
        <a class="navbar-brand" href="{{ url_for('search_query_page')}}">EvidenceDB</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
            <li class="nav-item active">
                <a class="nav-link" href="#">About</a>
            </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        {% block content %} {% endblock %}
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  </body>
</html>
